  # ---------------- Aggregators and remote APIs (added 2026-09-25) ----------------
  - name: JobStash
    type: jobstash
    enabled: true
    every_minutes: 60
    publication_date: past-2-weeks
    pages: 3
    watch: { publication_date: this-week, pages: 1 }   # 100 newest per word ("today" is a UTC day, it missed posts)
    queries: [crypto, blockchain, web3, defi, stablecoin, digital assets, onchain, bitcoin, ethereum, solana]

  - name: Remote APIs
    type: remote_apis          # Himalayas and Jobicy state which countries a remote job accepts
    enabled: true
    every_minutes: 60
    boards: [himalayas, jobicy]
    himalayas_queries: [crypto, blockchain, web3, defi, stablecoin, bitcoin, ethereum, solana, digital assets]
    jobicy_tags: [crypto, blockchain, web3, defi]

  - name: Indeed
    type: indeed               # via python-jobspy (Indeed's app API). The website itself blocks scripts
    enabled: true
    every_minutes: 180
    hours_old: 72
    results: 40
    searches: [blockchain, cryptocurrency, crypto exchange, web3, crypto compliance, crypto support, bitcoin]
    locations:
      - { location: India, country: India }

  - name: India boards
