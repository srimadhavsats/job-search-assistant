    type: ats
    enabled: true
    web3_native: false
    every_minutes: 60
    companies:
      Robinhood:       [greenhouse, robinhood]
      Brave:           [greenhouse, brave]
      Sardine:         [ashby, sardine]
      Figure:          [greenhouse, figure]

  # ---------------- Crypto VC portfolio boards (added 2026-09-25) ----------------
  # One board per fund lists every company it backed. Getro and Consider APIs, see vc_boards.py.
