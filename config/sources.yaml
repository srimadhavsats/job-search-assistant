# ============================================================================
#  JOB WEBSITES  —  add, remove or disable sources here.
#  Set "enabled: false" to skip one. See docs/ADDING_A_SOURCE.md for details.
#
#  Types:
#    rss      → any RSS/Atom job feed                          (no code needed)
#    html     → any simple job-list page, via CSS selectors    (no code needed)
#    ats      → company career pages on Greenhouse/Lever/Ashby (no code needed)
#    linkedin → LinkedIn public (logged-out) job search
#    naukri   → Naukri.com via headless Chrome
#    naukrigulf → NaukriGulf.com (UAE, Saudi, Qatar, Bahrain, Oman, Kuwait) via headless Chrome
#    telegram → public Telegram channels via t.me web preview (no account needed)
#    superteam→ Superteam Earn bounties/projects (freelance)
#    remote_boards → general remote job boards, filtered to crypto
#    custom   → your own Python file in jobhunter/sources/<module>.py
#
#  web3_native: true  → every job there is crypto, so it gets the +5 source bonus
#                       and never gets the "not a web3 job" penalty.
#
#  24x7 watcher (added 2026-09-25, jobhunter/watch.py):
#    every_minutes: N   → the watcher checks this source every N minutes (cheap public APIs often,
#                         sites that block scrapers rarely). Failures retry sooner, then back off.
#    watch: {...}       → settings used only by the quick watcher checks (e.g. fewer LinkedIn pages).
#                         run_jobs.bat (the full run) ignores them.
# ============================================================================

sources:

  # ---------------- The four requested sites ----------------

  - name: LinkedIn
    type: linkedin
    enabled: true
    every_minutes: 60        # watcher: fresh 24 h pass only, first 20 per search (see watch)
    watch: { fresh_results_per_search: 20, max_descriptions: 40 }
    mode: guest              # guest | google_index | session  (only guest is built — see handoff.md)
    fresh_window_hours: 24         # pass 1: last 24 h, newest first — catches today's posts
    fresh_results_per_search: 60
    results_per_search: 30         # pass 2: whole max_age_days window by relevance (earlier runs hold the rest)
    delay_seconds: 2
    max_descriptions: 120    # descriptions fetched only for titles that don't mention crypto/web3
    backoff_seconds: [60, 180]  # on HTTP 429 (rate limit): wait, retry; give up after these
    backfill_every_hours: 20   # pass 2 once a day (the 10:00 run). The 18:30 run does pass 1 only, which
                               # already covers everything posted since the morning. Descriptions are cached.

  - name: Naukri
    type: naukri
    enabled: true
    every_minutes: 240       # Akamai-protected, so a few visits a day, like a person
    pages_per_search: 1      # default; per-search pages are set in profile.yaml → naukri_searches
    delay_seconds: 4         # human-like pause between pages (randomised 3–6 s). Lower = faster but more blocks
    headless: true           # set false to watch the browser (or if Naukri starts blocking)

  - name: Apna
    type: apna
    enabled: true
    every_minutes: 360       # Link11 blocks fast scrapers
    # apna.co search matches loosely, so scoring filters. Added 2026-09-24. "bitcoin" and
    # "crypto exchange" were tried and return almost only non-crypto jobs.
    searches:
      - { q: blockchain, pages: 2 }
      - { q: crypto, pages: 2 }
      - cryptocurrency
      - web3
      - crypto aml
      - crypto kyc
    # Job pages (description + post date) only for cards that look relevant. Titles without these
    # words are scored on the card alone. Keep it small: apna.co blocks fast scrapers (see apna.py).
    detail_words: [blockchain, crypto, web3, bitcoin, coin, token, defi, kyc, aml, fraud, compliance,
                   transaction monitoring, investigat, support, trainer, analyst]
    max_details: 30
    delay_seconds: 3

  - name: Naukri Gulf
    type: naukrigulf
    enabled: true
    every_minutes: 480
    max_age_days: 30         # Gulf hiring moves slower; overrides profile.yaml's 14 days for this site
    pages_per_search: 2      # 30 jobs per page
    delay_seconds: 4
    headless: true

  - name: CryptoJobsList
    type: rss
    enabled: true
    every_minutes: 20
    web3_native: true
    url: https://cryptojobslist.com/rss   # newest ~100 jobs, full descriptions (site search is Cloudflare-blocked)
    company_from: author
    location_from: media_location

  # jobleads.com → Phase 2 (needs your one-time manual login)

  # ---------------- Web3 job boards ----------------

  - name: web3.career
    type: html
    enabled: true
    every_minutes: 60
    browser_fallback: true   # if Cloudflare ever refuses plain HTTP, read the page in headless Chrome
    web3_native: true
    base_url: https://web3.career
    urls:
      - https://web3.career/analyst-jobs
      - https://web3.career/support-jobs
      - https://web3.career/customer-support-jobs
      - https://web3.career/community-manager-jobs
      - https://web3.career/quality-assurance-jobs   # /qa-jobs is a 404 page (found 2026-09-25)
      - https://web3.career/devops-jobs
      - https://web3.career/research-jobs
      - https://web3.career/compliance-jobs
      - https://web3.career/operations-jobs
      - https://web3.career/non-tech-jobs
      - https://web3.career/entry-level-jobs
      - https://web3.career/junior-jobs
      - https://web3.career/web3-jobs-india
      - https://web3.career/remote-jobs
    pages: 2
    page_param: page
    delay_seconds: 1.5
    item: tr.table_row
    fields:
      title: h2
      company: h3
      location: span.job-location-mobile
      posted: time@datetime
      salary: p.text-salary
      link: "a@href"

  - name: crypto.jobs
    type: html
    enabled: true
    every_minutes: 720
    web3_native: true
    base_url: https://crypto.jobs
    urls:
      - https://crypto.jobs/jobs          # 50 per page, sorted oddly: page 1 has ~2 posts from the
    pages: 1                              # last 14 days, the rest are 2024 and 2025 (0 kept in every run to 2026-09-25)
    page_param: page
    delay_seconds: 1.5
    item: tr.job-entry
    fields:
      title: p.job-title
      company: "span[itemprop=hiringOrganization] span[itemprop=name]"
      location: "meta[itemprop=addressLocality]@content"
      posted: "meta[itemprop=datePosted]@content"
      description: "meta[itemprop=description]@content"
      link: "a.job-url@href"

  # hashtagweb3.com: its /jobs page shows the same 12 featured cards on every page (no working
  # pagination). Its full feed arrives through the web3hiring Telegram channel below instead.

  - name: CryptocurrencyJobs
    type: rss
    enabled: true
    every_minutes: 20
    web3_native: true
    url: https://cryptocurrencyjobs.co/index.xml
    company_from: title_at   # titles look like "Support Engineer at Company"

  # ---------------- Telegram channels (public, no account needed) ----------------

  - name: Telegram
    type: telegram
    enabled: true
    every_minutes: 30
    web3_native: true
    channels:
      - { name: laborx,          format: laborx,         kind: freelance, pages: 4 }   # client projects with budgets
      - { name: DeJob_Global,    format: dejob,          pages: 3 }
      - { name: web3hiring,      format: digest,         pages: 3 }
      - { name: cryptojobslist,  format: cryptojobslist, pages: 3 }
      - { name: blockchain_job,  format: generic,        pages: 2 }   # mostly Russian-language posts
      # remoteweb3jobs: posts a message type the web preview can't read — check it in the Telegram app

  # ---------------- Freelance / bounties ----------------

  - name: Superteam Earn
    type: superteam
    enabled: true
    every_minutes: 60
    eligible_regions: [Global, India]   # many bounties are one-country-only; the rest are skipped

  # ---------------- General remote boards (filtered to crypto) ----------------

  - name: Remote boards
    type: remote_boards
    enabled: true
    every_minutes: 60
    boards: [remotive, remoteok, weworkremotely, workingnomads]

